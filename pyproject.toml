[project]
name = "portfolio-profiler"
version = "0.1.0"
description = "Scrape a portfolio website and use an Ollama model to summarise the person behind it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "selenium>=4.20",
    "pydantic>=2.6",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
profiler = "profiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/profiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
